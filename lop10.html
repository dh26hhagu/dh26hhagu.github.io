<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tổng hợp thí nghiệm Hóa 10</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { margin:0; font-family: "Segoe UI", Arial, sans-serif; background:#f5f6f8; color:#222; }
        /* ===== HEADER ===== */
        .top { padding:20px 30px; background:white; border-bottom:1px solid #ddd; }
        .top h1 { margin:0; font-size:28px; }
        .top-bar { display:flex; align-items:center; justify-content:space-between; }
        .back-btn { width:42px; height:42px; border-radius:50%; background:#7a2bc2; color:white; text-decoration:none; display:flex; align-items:center; justify-content:center; font-size:18px; transition:0.3s; }
        .back-btn:hover { background:#5a1e96; transform:scale(1.05); }
        .search-box { margin-top:15px; }
        .search-box input { width:100%; max-width:420px; padding:10px 14px; font-size:15px; border-radius:8px; border:1px solid #ccc; outline:none; }
        .search-box input:focus { border-color:#7a2bc2; }

        /* ===== GRID & CARD ===== */
        .container { padding:30px; }
        .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:25px; }
        .card { background:white; border-radius:14px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.08); transition:0.3s; }
        .card:hover { transform:translateY(-5px); }
        .thumb { position:relative; height:150px; background:#ddd; }
        .thumb img { width:100%; height:100%; object-fit:cover; }
        .play-btn { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(0,0,0,0.6); color:white; font-size:30px; padding:12px 18px; border-radius:50%; text-decoration:none; }
        .card-content { padding:15px; }
        .card-content h3 { margin:0 0 10px; font-size:18px; }
        .channel { color: #666; font-size: 14px; margin: 0; }
    </style>
    <link rel="stylesheet" href="ui-system.css">
</head>
<body>

    <div class="top">
        <div class="top-bar">
            <h1><span id="resultCount">0</span> Kết quả</h1>
            <a href="index.html" class="back-btn" title="Quay lại">⬅</a>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Tìm thí nghiệm, video, nội dung...">
        </div>
    </div>

    <div class="container">
        <p id="noResultMsg" style="display: none; text-align: center; color: #888; width: 100%;">Không tìm thấy video thí nghiệm nào phù hợp.</p>
        
        <div class="grid" id="videoGrid">
            </div>

    <script type="module">
        import * as repository from "./experiment-repository.js";
        import { renderLoading, renderError } from "./components/ui.js";

        const LEGACY_BASELINE = [{"youtubeId":"Wuo8SachZYE","titleMarkup":"Phương pháp kết tinh muối hạt","channel":"Kênh: Cô Bích Ngọc Hóa Học"},{"youtubeId":"JSt808aOVRM","titleMarkup":"Mô phỏng thí nghiệm của Ernest Rutherford. Bắn tia alpha vào lá vàng mỏng. Tán xạ alpha","channel":"Kênh: ABC Chemistry"},{"youtubeId":"yvqW3pa8-Jw","titleMarkup":"So Sánh Tính Kim Loại Của Sodium Na Và Magnesium Mg","channel":"Kênh: Vũ Thị Lê"},{"youtubeId":"IsoLGZXwV9A","titleMarkup":"SO SÁNH TÍNH PHI KIM CỦA CHLORINE VÀ IODINE","channel":"Kênh: Học văn cùng cô Thu"},{"youtubeId":"qJH3nfVLypU","titleMarkup":"TO SHOW THAT METALLIC OXIDES ARE BASIC IN NATURE","channel":"Kênh: amritacreate"},{"youtubeId":"P7bI_ZoN9Kw","titleMarkup":"THÍ NGHIỆM PHẢN ỨNG CỦA DUNG DỊCH MUỐI NA2CO3 VỚI DUNG DỊCH AXIT HNO3","channel":"Kênh: Học văn cùng cô Thu"},{"youtubeId":"v8g3CK5kke0","titleMarkup":"Structure of Sodium Chloride (NaCl)","channel":"Kênh: Scholarswing"},{"youtubeId":"cRMZ0HH6R0Q","titleMarkup":"THÍ NGHIỆM THỬ TÍNH DẪN ĐIỆN CỦA HỢP CHẤT","channel":"Kênh: Học văn cùng cô Thu"},{"youtubeId":"mJqObq4xIDs","titleMarkup":"Mô phỏng lắp ráp mô hình phân tử Methane CH<sub>4</sub>","channel":"Kênh: EMILYCHEMIST"},{"youtubeId":"bV9ntYqngfg","titleMarkup":"Thí Nghiệm Đinh Sắt (Iron) Tác Dụng Với Dung Dịch CuSO<sub>4</sub> (Copper (II) sulfate)","channel":"Kênh: Vũ Thị Lê"},{"youtubeId":"RYhLr6ZD3lg","titleMarkup":"Thí nghiệm đinh Sắt (Iron) tác dụng với dung dịch Sulfuric Acid loãng (H₂SO₄) ","channel":"Kênh: bang nhat"},{"youtubeId":"a21Bby96Vgc","titleMarkup":"THÍ NGHIỆM THEO DÕI SỰ THAY ĐỔI NHIỆT ĐỘ CỦA PHẢN ỨNG TRUNG HÒA","channel":"Kênh: Học văn cùng cô Thu"},{"youtubeId":"EWb5q8Bl39A","titleMarkup":" Calorimetry: Calculate Enthalpy","channel":"Kênh: Anne Schmidt"},{"youtubeId":"lQpC_z11_4Y","titleMarkup":" Phản ứng Na<sub>2</sub>S<sub>2</sub>O<sub>3</sub> + H₂SO₄. Thí nghiệm ảnh hưởng của nồng độ đến tốc độ phản ứng","channel":"Kênh: WAYS OUT"},{"youtubeId":"SITu7XjGkAE","titleMarkup":" Ảnh Hưởng Của Nhiệt Độ Đến Tốc Độ Phản Ứng | Mg (Magnesium) Phản Ứng Với Nước","channel":"Kênh: Vũ Thị Lê"},{"youtubeId":"hf9eyJgqilA","titleMarkup":" ẢNH HƯỞNG CỦA DIỆN TÍCH BỀ MẶT ĐẾN TỐC ĐỘ PHẢN ỨNG | CaCO<sub>3</sub> (Calcium Carbonate) Tác Dụng Với Dung Dịch HCl (Hydrochloric Acid)","channel":"Kênh: Cô Bích Ngọc Hóa Học"},{"youtubeId":"LJXTOaeljeI","titleMarkup":" Ảnh Hưởng Của Chất Xúc Tác Đến Tốc Độ Phản Ứng | Phản Ứng Của H<sub>2</sub>O<sub>2</sub> Khi Có MnO<sub>2</sub> Xúc Tác","channel":"Kênh: Vũ Thị Lê"},{"youtubeId":"3xV_mYC5oFQ","titleMarkup":"CHLORINE (Cl<sub>2</sub>) TÁC DỤNG VỚI DÂY SẮT (IRON)","channel":"Kênh: Cô Bích Ngọc Hóa Học"},{"youtubeId":"qpL4KsnbAQ4","titleMarkup":"Thí Nghiệm Tính Tẩy Màu của Khí Chlorine Cl<sub>2</sub> | KMnO<sub>4</sub> Tác Dụng Với HCl","channel":"Kênh: Vũ Thị Lê"},{"youtubeId":"kksVWwZ3Y14","titleMarkup":"Cl<sub>2</sub> + KBr, Cl<sub>2</sub> + NaI, Br<sub>2</sub> + NaI. Comparing the oxidizing properties of Cl<sub>2</sub>, Br<sub>2</sub>, and I<sub>2</sub>","channel":"Kênh: ABC Chemistry"},{"youtubeId":"_XENzHwsaww","titleMarkup":"Dung Dịch HCl Tác Dụng Zn, Cu","channel":"Kênh: Cô Bích Ngọc Hóa Học"},{"youtubeId":"XYXcd3UMNIU","titleMarkup":"DUNG DỊCH HCl TÁC DỤNG MUỐI NaHCO3 rắn","channel":"Kênh: Cô Bích Ngọc Hóa Học"},{"youtubeId":"GDuG2OaW0oM","titleMarkup":"NHẬN BIẾT MUỐI HALIDE","channel":"Kênh: Cô Bích Ngọc Hóa Học"}];
        const grid = document.getElementById("videoGrid");
        const searchInput = document.getElementById("searchInput");
        const resultCount = document.getElementById("resultCount");
        const noResultMsg = document.getElementById("noResultMsg");
        const isRepositoryCheck = new URLSearchParams(window.location.search).has("repository-check");

        function normalizeText(value) {
            return String(value ?? "").trim().replace(/\s+/g, " ");
        }

        function normalizeLegacyTitle(markup) {
            const subscripts = { "0": "₀", "1": "₁", "2": "₂", "3": "₃", "4": "₄", "5": "₅", "6": "₆", "7": "₇", "8": "₈", "9": "₉" };
            const superscripts = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "+": "⁺", "-": "⁻" };
            return normalizeText(markup
                .replace(/<sub>(.*?)<\/sub>/gi, (_, value) => [...value].map((character) => subscripts[character] || character).join(""))
                .replace(/<sup>(.*?)<\/sup>/gi, (_, value) => [...value].map((character) => superscripts[character] || character).join(""))
                .replace(/<[^>]*>/g, "")
                .replace(/&amp;/g, "&"));
        }

        function reportParity(message, passed) {
            window.lop10RepositoryParity = { passed, message };
            if (!isRepositoryCheck) return;
            let status = document.getElementById("repositoryCheckStatus");
            if (!status) {
                status = document.createElement("p");
                status.id = "repositoryCheckStatus";
                status.setAttribute("role", passed ? "status" : "alert");
                status.style.cssText = "padding:12px 30px;margin:0;background:#fff;color:#222";
                document.querySelector(".top").append(status);
            }
            status.textContent = message;
        }

        function createLegacyCard(item) {
            const experiment = item.experiment;
            const card = document.createElement("div");
            card.className = "card video-card";
            card.dataset.experimentId = experiment.id;
            card.dataset.youtubeId = item.video.youtubeId;
            card.dataset.grade = String(experiment.grade);
            card.dataset.badge = item.badge;

            const thumb = document.createElement("div");
            thumb.className = "thumb";
            const image = document.createElement("img");
            image.src = item.thumbnail;
            image.alt = `Thumbnail: ${item.title}`;
            image.loading = "lazy";
            image.decoding = "async";

            const play = document.createElement("a");
            play.className = "play-btn";
            play.href = item.ytLink;
            play.target = "_blank";
            play.rel = "noopener noreferrer";
            play.setAttribute("aria-label", `Mở video: ${item.title}`);
            play.textContent = "▶";
            thumb.append(image, play);

            const content = document.createElement("div");
            content.className = "card-content";
            const heading = document.createElement("h3");
            heading.textContent = item.title;
            const channel = document.createElement("p");
            channel.className = "channel";
            channel.textContent = item.video.channel;
            content.append(heading, channel);
            card.append(thumb, content);
            return card;
        }

        function normalizeVietnameseTones(value) {
            return value.normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/g, "d")
                .replace(/Đ/g, "D")
                .toLowerCase();
        }

        function updateCount(cards) {
            const visibleCount = cards.filter((card) => card.style.display !== "none").length;
            resultCount.textContent = visibleCount;
            noResultMsg.style.display = visibleCount === 0 ? "block" : "none";
        }

        function checkOrderedParity(occurrences) {
            const errors = [];
            if (occurrences.length !== LEGACY_BASELINE.length || LEGACY_BASELINE.length !== 23) {
                errors.push(`count expected 23, got ${occurrences.length}`);
            }

            for (let index = 0; index < LEGACY_BASELINE.length; index += 1) {
                const expected = LEGACY_BASELINE[index];
                const actual = occurrences[index];
                if (!actual) {
                    errors.push(`position ${index + 1}: missing occurrence`);
                    continue;
                }
                const expectedTitle = normalizeLegacyTitle(expected.titleMarkup);
                const fields = [
                    ["YouTube ID", actual.video?.youtubeId, expected.youtubeId],
                    ["title", normalizeText(actual.title), expectedTitle],
                    ["thumbnail", actual.thumbnail, `https://img.youtube.com/vi/${expected.youtubeId}/hqdefault.jpg`],
                    ["YouTube URL", actual.ytLink, `https://www.youtube.com/watch?v=${expected.youtubeId}`],
                    ["channel", normalizeText(actual.video?.channel), normalizeText(expected.channel)],
                    ["badge", actual.badge, "Lớp 10"],
                    ["grade", actual.experiment?.grade, 10]
                ];
                for (const [field, actualValue, expectedValue] of fields) {
                    if (actualValue !== expectedValue) {
                        errors.push(`position ${index + 1} ${field}: expected ${expectedValue}, got ${actualValue}`);
                    }
                }
            }
            return errors;
        }

        async function initializePage() {
            renderLoading(grid, "Đang tải danh sách thí nghiệm…");
            try {
                await repository.load();
                const occurrences = await repository.getPageOccurrences("lop10");
                const errors = checkOrderedParity(occurrences);
                if (errors.length) {
                    reportParity(`LOP10 REPOSITORY PARITY FAIL: ${errors.join("; ")}`, false);
                    renderError(grid, "Không thể xác minh dữ liệu Lớp 10. Vui lòng tải lại trang.");
                    return;
                }

                const cards = occurrences.map(createLegacyCard);
                grid.replaceChildren(...cards);
                updateCount(cards);
                reportParity("LOP10 REPOSITORY PARITY PASS: 23/23 vị trí; ID, title, thumbnail, URL, channel, badge và grade khớp baseline.", true);

                searchInput.addEventListener("input", function () {
                    const keyword = normalizeVietnameseTones(this.value.trim());
                    cards.forEach((card) => {
                        const searchableText = normalizeVietnameseTones(card.innerText);
                        card.style.display = searchableText.includes(keyword) ? "block" : "none";
                    });
                    updateCount(cards);
                });
            } catch (error) {
                reportParity(`LOP10 REPOSITORY LOAD FAIL: ${error.message}`, false);
                renderError(grid, "Không thể tải danh sách thí nghiệm. Vui lòng thử lại sau.");
            }
        }

        initializePage();
    </script>
    <script src="ui-enhance.js"></script>
</body>
</html>
