  <title>Periodic - Periodic Table 118</title>
  <style>
    :root {--bg:#f5f7fb;--panel:#ffffff;--text:#111827;--muted:#6b7280;--line:#d1d5db}
    body.dark {--bg:#0f172a;--panel:#111827;--text:#f3f4f6;--muted:#9ca3af;--line:#334155}
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
    .container { max-width:1600px; margin:0 auto; padding:16px; }
    h1 { margin:0 0 12px; font-size:26px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
    input,select,button,.nav-link { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); font:inherit; text-decoration:none; }
    .nav-link:hover,button:hover { filter:brightness(0.98); }
    .legend { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px; }
    .tag { font-size:12px; color:#fff; border-radius:999px; padding:6px 10px; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:10px; }
    .periodic-grid { display:grid; grid-template-columns:repeat(18,minmax(58px,1fr)); grid-auto-rows:74px; gap:6px; min-width:1120px; }
    .row-label { display:flex; align-items:center; font-size:12px; color:var(--muted); padding-left:4px; font-weight:600; }
    .element { border:1px solid rgba(0,0,0,0.08); border-radius:10px; color:#fff; cursor:pointer; display:flex; flex-direction:column; justify-content:space-between; padding:6px; transition:transform .2s ease, box-shadow .2s ease; }
    .element:hover { transform:scale(1.06); box-shadow:0 10px 18px rgba(0,0,0,0.22); z-index:2; }
    .num { font-size:11px; font-weight:700; } .sym { font-size:24px; line-height:1; font-weight:800; text-align:center; } .name { font-size:10px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .c-alkali { background:#e53935; } .c-alkaline-earth { background:#fb8c00; } .c-transition { background:#1e88e5; } .c-nonmetal { background:#43a047; } .c-halogen { background:#2e7d32; } .c-noble-gas { background:#8e24aa; } .c-metalloid { background:#fbc02d; color:#111; } .c-lanthanide,.c-actinide { background:#00acc1; } .c-post-transition { background:#546e7a; }
    .modal { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; padding:16px; } .modal.show { display:flex; }
    .modal-card { width:min(560px,100%); border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:18px; } .modal-card h2 { margin:0 0 10px; }
    .detail { display:grid; grid-template-columns:170px 1fr; gap:8px; font-size:14px; } .muted { color:var(--muted); }
    .footer-note { margin-top:8px; font-size:12px; color:var(--muted); }
    @media (max-width:768px) { .periodic-grid { grid-auto-rows:64px; min-width:1000px; } .sym { font-size:20px; } }
  </style>
</head>

      const visible = elements.filter((el) => {
        const matchText = !query || el.name.toLowerCase().includes(query) || el.symbol.toLowerCase().includes(query);
        const matchFilter = filter === 'all' || el.category === filter;
        return matchText && matchFilter;
      });

      const lanthLabel = document.createElement('div');
      lanthLabel.className = 'row-label';
      lanthLabel.style.gridColumn = '1 / span 3';
      lanthLabel.style.gridRow = '8';
      lanthLabel.textContent = 'Lanthanides';
      grid.appendChild(lanthLabel);

      const actLabel = document.createElement('div');
      actLabel.className = 'row-label';
      actLabel.style.gridColumn = '1 / span 3';
      actLabel.style.gridRow = '9';
      actLabel.textContent = 'Actinides';
      grid.appendChild(actLabel);

      visible.forEach((el) => {
        const cell = document.createElement('button');
        cell.className = `element ${toClass(el.category)}`;
        cell.style.gridColumn = String(el.displayGroup);
        cell.style.gridRow = String(el.displayPeriod);
        cell.innerHTML = `<div class="num">${el.number}</div><div class="sym">${el.symbol}</div><div class="name">${el.name}</div>`;
        cell.addEventListener('click', () => openModal(el));
        grid.appendChild(cell);
      });

      resultCount.textContent = `Hiển thị ${visible.length} / ${elements.length} nguyên tố`;
    }

    // EVENT
    function openModal(el) {
      modalCard.innerHTML = `
        <h2>${el.name} (${el.symbol})</h2>
        <div class="detail">
          <div class="muted">Atomic number (Z)</div><div>${el.number}</div>
          <div class="muted">Atomic mass</div><div>${el.mass}</div>
          <div class="muted">Electron configuration</div><div>${el.electronConfig}</div>
          <div class="muted">Electronegativity</div><div>${el.electronegativity ?? 'N/A'}</div>
          <div class="muted">Category</div><div>${el.category}</div>
          <div class="muted">Period / Group</div><div>${el.period} / ${el.group}</div>
        </div>`;
      modal.classList.add('show');
    }

    function setTheme(isDark) {
      document.body.classList.toggle('dark', isDark);
      themeBtn.textContent = isDark ? '☀️ Light mode' : '🌙 Dark mode';
      localStorage.setItem('periodic-theme', isDark ? 'dark' : 'light');
    }

    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.classList.remove('show'); });
    searchInput.addEventListener('input', renderTable);
    filterSelect.addEventListener('change', renderTable);
    resetBtn.addEventListener('click', () => { searchInput.value = ''; filterSelect.value = 'all'; renderTable(); });
    themeBtn.addEventListener('click', () => setTheme(!document.body.classList.contains('dark')));

    setTheme(localStorage.getItem('periodic-theme') === 'dark');
    renderTable();
  </script>
</body>
</html>
