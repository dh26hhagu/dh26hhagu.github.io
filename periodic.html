<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periodic Table - 118 Elements</title>
  <style>
    :root {
      --bg: #020617;
      --bg-soft: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #1f2937;
      --tile-text: #0f172a;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #111827 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      max-width: 1700px;
      margin: 0 auto;
      padding: clamp(12px, 2vw, 22px);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 2vw, 2.2rem);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }

    .toolbar input,
    .toolbar select {
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      min-width: min(100%, 250px);
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.7);
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex: 0 0 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 16px;
      align-items: start;
    }

    .table-wrap {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.75);
      padding: 12px;
      overflow: auto;
    }

    .periodic-grid {
      min-width: 1300px;
      display: grid;
      grid-template-columns: 72px repeat(18, minmax(62px, 1fr));
      grid-template-rows: 48px repeat(7, 84px) 84px 84px;
      gap: 6px;
      align-items: stretch;
    }

    .corner-cell,
    .group-label,
    .period-label,
    .f-block-label {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(15, 23, 42, 0.8);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.78rem;
      padding: 4px;
      white-space: nowrap;
      overflow: hidden;
    }

    .corner-cell {
      flex-direction: column;
      gap: 2px;
      font-size: 0.72rem;
    }

    .group-label { flex-direction: column; line-height: 1.1; }
    .group-label small { font-size: 0.68rem; }

    .f-block-label {
      justify-content: flex-start;
      padding-left: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .element {
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: var(--radius);
      color: var(--tile-text);
      padding: 5px;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      align-items: center;
      justify-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease, border-color 180ms ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      position: relative;
      background: #e2e8f0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      user-select: none;
    }

    .element > * {
      width: 100%;
      margin: 0;
      min-width: 0;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
    }

    .element.hovered,
    .element:focus-visible {
      transform: scale(1.1);
      z-index: 20;
      box-shadow: 0 14px 25px rgba(0, 0, 0, 0.4);
      filter: brightness(1.03);
      outline: none;
    }

    .element.active {
      border-color: #f8fafc;
      box-shadow: 0 0 0 2px rgba(248, 250, 252, 0.95), 0 0 24px rgba(56, 189, 248, 0.95), 0 0 36px rgba(59, 130, 246, 0.45);
      transform: scale(1.08);
      z-index: 25;
    }

    .atomic-number { font-size: clamp(0.62rem, 0.8vw, 0.72rem); font-weight: 700; }
    .symbol { font-size: clamp(1.02rem, 1.6vw, 1.35rem); font-weight: 800; line-height: 1; }
    .element-name {
      display: block;
      text-align: center;
      line-height: 1.1;
      font-size: 0.8rem;
    }
    .mass {
      font-size: clamp(0.58rem, 0.8vw, 0.64rem);
      opacity: 0.95;
      text-overflow: clip;
    }

    .alkali-metal { background: #fca5a5; }
    .alkaline-earth-metal { background: #fdba74; }
    .transition-metal { background: #93c5fd; }
    .post-transition-metal { background: #c4b5fd; }
    .metalloid { background: #fcd34d; }
    .nonmetal { background: #86efac; }
    .halogen { background: #5eead4; }
    .noble-gas { background: #f9a8d4; }
    .lanthanide { background: #67e8f9; }
    .actinide { background: #22d3ee; }

    .detail-panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.85);
      padding: 14px;
      position: sticky;
      top: 14px;
      min-height: 380px;
    }

    .detail-panel h2 {
      margin-top: 0;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .detail-panel.panel-transition { animation: panel-fade 220ms ease; }

    @keyframes panel-fade {
      from { opacity: 0.6; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(120px, 145px) 1fr;
      gap: 6px 10px;
      font-size: 0.9rem;
    }

    .detail-grid > div {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .count-info {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 1180px) {
      .layout { grid-template-columns: 1fr; }
      .detail-panel { position: static; }
    }

    @media (max-width: 860px) {
      .periodic-grid {
        min-width: 980px;
        grid-template-columns: 62px repeat(18, minmax(46px, 1fr));
        grid-template-rows: 40px repeat(7, 74px) 74px 74px;
        gap: 4px;
      }

      .element {
        border-radius: 9px;
        padding: 4px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Periodic Table (IUPAC + Classical Groups)</h1>
    <p class="subtitle">118 elements with full detail panel, proper structure, f-block rows, and superscript electron configuration rendering.</p>
    <section class="toolbar" aria-label="Filter controls">
      <input id="search" type="search" placeholder="Search by name, symbol, or atomic number">
      <select id="category-filter">
        <option value="all">All categories</option>
        <option value="alkali metal">Alkali metal</option>
        <option value="alkaline earth metal">Alkaline earth metal</option>
        <option value="transition metal">Transition metal</option>
        <option value="post-transition metal">Post-transition metal</option>
        <option value="metalloid">Metalloid</option>
        <option value="nonmetal">Nonmetal</option>
        <option value="halogen">Halogen</option>
        <option value="noble gas">Noble gas</option>
        <option value="lanthanide">Lanthanide</option>
        <option value="actinide">Actinide</option>
      </select>
    </section>
    <section class="legend" aria-label="Category legend">
      <div class="legend-item"><span class="legend-swatch alkali-metal"></span>Alkali metal</div>
      <div class="legend-item"><span class="legend-swatch alkaline-earth-metal"></span>Alkaline earth metal</div>
      <div class="legend-item"><span class="legend-swatch transition-metal"></span>Transition metal</div>
      <div class="legend-item"><span class="legend-swatch post-transition-metal"></span>Post-transition metal</div>
      <div class="legend-item"><span class="legend-swatch metalloid"></span>Metalloid</div>
      <div class="legend-item"><span class="legend-swatch nonmetal"></span>Nonmetal</div>
      <div class="legend-item"><span class="legend-swatch halogen"></span>Halogen</div>
      <div class="legend-item"><span class="legend-swatch noble-gas"></span>Noble gas</div>
      <div class="legend-item"><span class="legend-swatch lanthanide"></span>Lanthanide</div>
      <div class="legend-item"><span class="legend-swatch actinide"></span>Actinide</div>
    </section>

    <div class="layout">
      <section class="table-wrap" aria-label="Periodic table area">
      <div id="periodic-table" class="periodic-grid"></div>
        <div id="count-info" class="count-info"></div>
      </section>

      <aside id="detail-panel" class="detail-panel" aria-live="polite"></aside>
    </div>
  </main>

  <script src="periodic.js"></script>
</body>
</html>
