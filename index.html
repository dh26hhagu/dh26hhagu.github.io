
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng hợp thí nghiệm</title>

    <style>
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #333;
}

/* ===== HEADER ===== */
header {
    background: url("hoahoc2.jpg") center/cover no-repeat;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.header-overlay {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

header h1 {
    color: #1a5dcc;
    font-size: 32px;
}

/* ===== NAV ===== */
.nav-bar {
    background: #1a5dcc;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

/* center menu */
.nav-center {
    display: flex;
    justify-content: center;
    gap: 20px;
}

/* item */
.nav-item {
    position: relative;
    background: white;
    padding: 8px 14px;
    border-radius: 12px;
}

/* link */
.nav-main {
    color: #1a5dcc;
    font-weight: 600;
    text-decoration: none;
}

/* dropdown */
.nav-dropdown {
    display: none;
    position: absolute;
    top: 45px;
    left: 0;
    background: white;
    min-width: 180px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.nav-dropdown a {
    display: block;
    padding: 10px;
    color: #1a5dcc;
    text-decoration: none;
}

.nav-dropdown a:hover {
    background: #f0f4ff;
}

/* search */
.nav-search {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
}

.nav-search input {
    padding: 8px 14px;
    border-radius: 20px;
    border: none;
    width: 200px;
}

/* ===== MAIN ===== */
main {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

main h2 {
    font-size: 26px;
    margin-bottom: 10px;
}

main p {
    font-size: 16px;
    line-height: 1.6;
}

/* ===== CARD ===== */
.card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* ===== FOOTER ===== */
footer {
    background: #1a5dcc;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 40px;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {

    /* header nhỏ lại */
    header {
        height: 200px;
    }

    header h1 {
        font-size: 24px;
    }

    /* nav xếp dọc */
    .nav-center {
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    /* search xuống dưới */
    .nav-search {
        position: static;
        transform: none;
        margin-top: 10px;
        text-align: center;
    }

    .nav-search input {
        width: 90%;
    }

    /* card 1 cột */
    .card-container {
        grid-template-columns: 1fr;
    }

    main {
        margin: 20px auto;
    }
}

/* ================= TABLET ================= */
@media (min-width: 769px) and (max-width: 1024px) {
    .card-container {
        grid-template-columns: repeat(2, 1fr);
    }
}
</script>

</head>

<body>

<header>
    <div class="header-overlay">
        <h1>Tổng hợp thí nghiệm</h1>
    </div>
</header>

<nav class="nav-bar">

    <!-- MENU Ở GIỮA -->
    <div class="nav-center">
        <div class="nav-item">
            <a href="thinghiem.html" class="nav-main">Hóa học</a>
            <span class="nav-arrow" onclick="toggleMenu()">▼</span>

            <div class="nav-dropdown" id="experimentMenu">
                <a href="lop10.html">Lớp 10</a>
                <a href="lop11.html">Lớp 11</a>
                <a href="lop12.html">Lớp 12</a>
            </div>
        </div>

        <div class="nav-item">
            <a href="#" class="nav-main">Coming soon</a>
        </div>
    </div>

    <!-- SEARCH GÓC PHẢI -->
    <div class="nav-search">
        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Tìm thí nghiệm..."
            onkeyup="searchExperiment()"
        >
    </div>

</nav>
<main>
    <h2>Xin chào 👋</h2>
    <p>
        Website tổng hợp thí nghiệm Hóa học dành cho học sinh THPT, hỗ trợ học tập.
    </p>
</main>

<footer>
    © 2026 – Website thí nghiệm Hóa học | Sinh viên thực hiện
</footer>

</body>
</html>
